name: image

# Builds the core and full images for amd64 and arm64 on native runners, runs the integration
# suite inside each one, and publishes to GHCR (with SBOM + SLSA provenance attestations):
#   push to main                   -> :edge-core, :edge-full
#   release (tag vX.Y.Z, or called
#   by release-please with `tag`)  -> :X.Y.Z-core, :X.Y-core, :core, :X.Y.Z-full, :X.Y-full, :full, :latest
# Pull requests build and test only. The skills pin the image by VERSION, so a tag must match it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.2.0)
        type: string
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/design-skills
  # A release is a pushed v* tag or a call from release-please; either way we build that tag.
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || (startsWith(github.ref, 'refs/tags/v') && github.ref) || '' }}

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  # Superseded main/PR runs are cancelled; release runs always finish.
  cancel-in-progress: ${{ inputs.tag == '' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        variant: [core, full]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Version
        id: v
        run: |
          v=$(cat VERSION)
          if [[ -n $RELEASE_REF && ${RELEASE_REF#refs/tags/v} != "$v" ]]; then
            echo "::error::tag ${RELEASE_REF#refs/tags/} does not match VERSION $v"; exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build (and load for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Integration tests inside the image
        run: make test-${{ matrix.variant }} IMAGE=${{ env.IMAGE }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest (with SBOM + provenance)
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: digests-${{ inputs.tag || 'edge' }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [core, full]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ inputs.tag || 'edge' }}-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          v=$(cat VERSION); variant=${{ matrix.variant }}
          if [[ -n $RELEASE_REF ]]; then
            tags=("$v-$variant" "${v%.*}-$variant" "$variant")
            [[ $variant == full ]] && tags+=(latest)
          else
            tags=("edge-$variant")
          fi
          args=(); for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          cd /tmp/digests
          # shellcheck disable=SC2046  # one argument per digest file, on purpose
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          for t in "${tags[@]}"; do echo "✔ $IMAGE:$t"; done

  release:
    if: github.event_name == 'push' && (inputs.tag || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}
      - name: Release notes with the image references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          # shellcheck disable=SC2016  # literal Markdown backticks, not command substitution
          images=$(printf '\n### Images\n```\ndocker pull %s:%s-core\ndocker pull %s:%s-full\n```\n' "$IMAGE" "$v" "$IMAGE" "$v")
          if gh release view "v$v" >/dev/null 2>&1; then
            # release-please created it: append the image references once.
            body=$(gh release view "v$v" --json body -q .body)
            [[ $body == *"docker pull"* ]] || gh release edit "v$v" --notes "$body$images"
          else
            awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md >notes.md
            printf '%s\n' "$images" >>notes.md
            gh release create "v$v" --title "v$v" --notes-file notes.md
          fi
