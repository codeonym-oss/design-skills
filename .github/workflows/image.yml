name: image

# Builds the core and full images for amd64 and arm64 on native runners, runs the integration
# suite inside each one, and publishes to GHCR:
#   push to main  -> :edge-core, :edge-full
#   tag vX.Y.Z    -> :X.Y.Z-core, :X.Y-core, :core, :X.Y.Z-full, :X.Y-full, :full, :latest
# The skills pin the image by VERSION, so a tag must match the VERSION file.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['docker/**', 'lib/**', 'bin/**', 'skills/**', 'tests/**', 'VERSION', 'Makefile', '.github/workflows/image.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/design-skills

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        variant: [core, full]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        run: |
          v=$(cat VERSION)
          if [[ $GITHUB_REF == refs/tags/v* && ${GITHUB_REF#refs/tags/v} != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match VERSION $v"; exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build (and load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Integration tests inside the image
        run: make test-${{ matrix.variant }} IMAGE=${{ env.IMAGE }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          d='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [core, full]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          v=$(cat VERSION); variant=${{ matrix.variant }}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tags=("$v-$variant" "${v%.*}-$variant" "$variant")
            [[ $variant == full ]] && tags+=(latest)
          else
            tags=("edge-$variant")
          fi
          args=(); for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          cd /tmp/digests
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          for t in "${tags[@]}"; do docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Manifests}}' | head -c 300; echo; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md >notes.md
          printf '\n**Images**\n```\ndocker pull %s:%s-core\ndocker pull %s:%s-full\n```\n' "$IMAGE" "$v" "$IMAGE" "$v" >>notes.md
          gh release create "v$v" --title "v$v" --notes-file notes.md
