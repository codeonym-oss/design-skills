name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Lint (shellcheck)
        run: make lint
      - name: Unit tests (dispatcher, CLI, check library, repo consistency)
        run: make test-unit BATS=bats
      - name: Unit tests under bash 3.2 (macOS host compatibility)
        run: make test-bash32

  # Squash merges use the PR title as the commit message, and release-please builds versions and
  # the changelog from those commits — so PR titles must be conventional commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            build
            docs
            refactor
            test
            ci
            chore
            revert
          requireScope: false
