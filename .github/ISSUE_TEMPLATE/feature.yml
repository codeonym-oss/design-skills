name: Feature or skill request
description: A new skill, script, tool in the image, or an improvement.
type: Feature
body:
  - type: textarea
    id: job
    attributes:
      label: What do you want to get done?
      description: Describe the design job, not the implementation ("make OG images from my blog posts").
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: tools
    attributes:
      label: Tools involved
      description: Open-source CLI tools that could do it headlessly (and whether they're packaged for Ubuntu).
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a PR for this (see CONTRIBUTING.md)
