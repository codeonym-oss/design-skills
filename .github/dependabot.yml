version: 2
updates:
  - package-ecosystem: docker          # the pinned ubuntu:26.04 digest (security updates)
    directory: /docker
    schedule: { interval: weekly }
    commit-message: { prefix: "build(image)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
    groups:
      actions:                          # one PR for all action bumps (separate PRs conflict)
        patterns: ["*"]
